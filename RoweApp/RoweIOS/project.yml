name: RoweIOS
options:
  postGenCommand: "python3 scripts/fix-local-package-backlinks.py"
  bundleIdPrefix: com.rowe
  deploymentTarget:
    iOS: "18.0"
packages:
  RoweCore:
    path: ../RoweCore
targets:
  RoweIOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App
      - path: DesignSystem
      - path: LiveActivity
      - path: Services
      - path: Views
      - path: ../RoweShared
      - path: Resources/Shaders/GlassGlow.metal
      - path: Resources/Assets.xcassets
      - path: Resources/Wallpapers
        buildPhase: resources
        type: folder
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.rowe.ios
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconDark
    dependencies:
      - package: RoweCore
      - target: RoweWidgetExtension
        embed: true
      - sdk: ActivityKit.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: CryptoKit.framework

  RoweWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: WidgetExtension
        excludes:
          - Info.plist
      - path: LiveActivity
    settings:
      base:
        INFOPLIST_FILE: WidgetExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.rowe.ios.widgets
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    dependencies:
      - sdk: ActivityKit.framework
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
